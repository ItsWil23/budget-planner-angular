<div class="overlay" (click)="onOverlayClick($event)">
  <div
    class="panel"
    role="dialog"
    aria-modal="true"
    tabindex="-1"
    [attr.aria-labelledby]="title() ? titleId : null"
    (click)="$event.stopPropagation()"
  >
    <header class="modal-header">
      @if (title(); as modalTitle) {
        <h2 class="modal-title" [id]="titleId">{{ modalTitle }}</h2>
      }
      <button
        type="button"
        class="close-btn"
        (click)="closed.emit()"
        [attr.aria-label]="'modal.close' | transloco"
        [title]="'modal.close' | transloco"
      >
        <svg viewBox="0 0 32 32" class="close-icon">
          <path
            d="M10.722 9.969l-0.754 0.754 5.278 5.278-5.253 5.253 0.754
                      0.754 5.253-5.253 5.253 5.253 0.754-0.754-5.253-5.253
                      5.278-5.278-0.754-0.754-5.278 5.278z"
          ></path>
        </svg>
      </button>
    </header>
    <div class="modal-body">
      <ng-content />
    </div>
  </div>
</div>
