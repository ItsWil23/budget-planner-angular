<div class="month-selector">
  <button
    type="button"
    class="month-button"
    aria-label="{{ 'monthSelector.previous' | transloco }}"
    (click)="previousMonth()"
  >
    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
      <polyline points="15 18 9 12 15 6" />
    </svg>
  </button>

  <span class="month-label">
    @for (reserved of reservedLabels(); track $index) {
      <span class="month-label-reserve" aria-hidden="true">{{ reserved }}</span>
    }
    <span class="month-label-value">{{ monthLabel() }}</span>
  </span>

  <button
    type="button"
    class="month-button"
    aria-label="{{ 'monthSelector.next' | transloco }}"
    (click)="nextMonth()"
  >
    <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
      <polyline points="9 18 15 12 9 6" />
    </svg>
  </button>

  @if (!isCurrentMonth()) {
    <button type="button" class="today-button" [attr.aria-label]="'monthSelector.today' | transloco" (click)="goToToday()">
      <svg viewBox="0 0 24 24" class="icon" aria-hidden="true">
        <rect x="3" y="4" width="18" height="18" rx="2" />
        <line x1="16" y1="2" x2="16" y2="6" />
        <line x1="8" y1="2" x2="8" y2="6" />
        <line x1="3" y1="10" x2="21" y2="10" />
      </svg>
      <span class="today-text-short">{{ 'monthSelector.todayShort' | transloco }}</span>
      <span class="today-text">{{ 'monthSelector.today' | transloco }}</span>
    </button>
  }
</div>
