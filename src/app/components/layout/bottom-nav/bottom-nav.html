<nav class="bottom-nav" [attr.aria-label]="'bottomNav.label' | transloco">
  <ul class="bottom-nav-list">
    @for (item of items; track item.path) {
      <li>
        <a
          class="bottom-nav-item"
          routerLinkActive="active"
          ariaCurrentWhenActive="page"
          [routerLinkActiveOptions]="{ exact: true }"
          [routerLink]="item.path"
        >
          @switch (item.icon) {
            @case ('dashboard') {
              <svg class="bottom-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <rect x="3" y="3" width="7" height="7" rx="1.5" />
                <rect x="14" y="3" width="7" height="7" rx="1.5" />
                <rect x="3" y="14" width="7" height="7" rx="1.5" />
                <rect x="14" y="14" width="7" height="7" rx="1.5" />
              </svg>
            }
            @case ('transactions') {
              <svg class="bottom-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M7 4v16" />
                <path d="M3 8l4-4 4 4" />
                <path d="M17 20V4" />
                <path d="M21 16l-4 4-4-4" />
              </svg>
            }
            @case ('categories') {
              <svg class="bottom-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L3 12V3h9l8.6 8.6a2 2 0 0 1 0 2.8z" />
                <circle cx="7.5" cy="7.5" r="1.5" />
              </svg>
            }
            @case ('budget') {
              <svg class="bottom-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M21.2 15.9A10 10 0 1 1 8 2.8" />
                <path d="M22 12A10 10 0 0 0 12 2v10z" />
              </svg>
            }
            @case ('settings') {
              <svg class="bottom-nav-icon" viewBox="0 0 24 24" aria-hidden="true">
                <line x1="4" y1="21" x2="4" y2="14" />
                <line x1="4" y1="10" x2="4" y2="3" />
                <line x1="12" y1="21" x2="12" y2="12" />
                <line x1="12" y1="8" x2="12" y2="3" />
                <line x1="20" y1="21" x2="20" y2="16" />
                <line x1="20" y1="12" x2="20" y2="3" />
                <line x1="1" y1="14" x2="7" y2="14" />
                <line x1="9" y1="8" x2="15" y2="8" />
                <line x1="17" y1="16" x2="23" y2="16" />
              </svg>
            }
          }
          <span class="bottom-nav-label">{{ (item.shortLabelKey ?? item.labelKey) | transloco }}</span>
        </a>
      </li>
    }
  </ul>
</nav>
