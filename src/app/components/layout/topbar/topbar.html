<div class="topbar">
  <div class="topbar-start">
    <button
      class="hamburger"
      [class.hidden]="menuOpen"
      [attr.aria-expanded]="menuOpen"
      aria-label="{{ 'topbar.menu' | transloco }}"
      (click)="menuToggle.emit()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
    <h1 class="topbar-title">
      @if (titleKey(); as key) {
        {{ key | transloco }}
      }
    </h1>
    @if (topbarAction(); as actionTemplate) {
      <div class="topbar-action">
        <ng-container *ngTemplateOutlet="actionTemplate" />
      </div>
    }
  </div>
  @if (showMonthSelector()) {
    <app-month-selector />
  }
  <div class="topbar-end">
    <!-- Emplacement de l'avatar (lot 5) -->
  </div>
</div>
