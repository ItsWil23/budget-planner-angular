<div class="page-header">
  <button
    #newButton
    type="button"
    class="btn new-transaction-btn"
    (click)="openModal()"
    [title]="'transactions.addTooltip' | transloco"
  >
    <svg viewBox="0 0 448 512" class="icon">
      <path
        d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"
      />
    </svg>
    {{ 'transactions.newButton' | transloco }}
  </button>
</div>
<div class="transactions-list-card">
  <app-transaction-list
    [transactions]="transactions()"
    [categories]="categories()"
    [subcategories]="subcategories()"
    (editTransaction)="openEdit($event.id)"
    (deleteTransaction)="onTransactionDelete($event)"
  />
</div>
@if (deleteTarget(); as target) {
  <app-modal [title]="'transactions.deleteTitle' | transloco" (closed)="cancelDelete()">
    <p class="delete-message">{{ 'transactions.deleteMessage' | transloco: { label: target.label } }}</p>
    <div class="delete-actions">
      <button type="button" class="btn btn-secondary" data-action="cancel-delete" (click)="cancelDelete()">
        {{ 'transactions.deleteCancel' | transloco }}
      </button>
      <button type="button" class="btn btn-danger" data-action="confirm-delete" (click)="confirmDelete()">
        {{ 'transactions.deleteConfirm' | transloco }}
      </button>
    </div>
  </app-modal>
}
@for (notice of notices(); track notice.id) {
  <app-undo-toast
    [message]="notice.message"
    [actionLabel]="notice.removed ? ('transactions.undo' | transloco) : null"
    (action)="undoDelete(notice)"
    (expired)="removeNotice(notice.id)"
  />
}
@if (isModalOpened()) {
  <div>
    <app-modal
      [title]="(editingId() ? 'transactions.editTitle' : 'transactions.newButton') | transloco"
      (closed)="onModalClosed()"
    >
      <app-transaction-form
        [formCategories]="categories()"
        [formSubcategories]="subcategories()"
        [aggregateOverflow]="aggregateOverflow()"
        [transaction]="editingTransaction()"
        (transactionSubmit)="onTransactionSubmit($event)"
        (draftChange)="onTransactionDraftChange()"
        (cancel)="onTransactionCancel()"
      ></app-transaction-form>
    </app-modal>
  </div>
}
