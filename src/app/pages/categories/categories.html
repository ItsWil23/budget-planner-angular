<div class="page-container">
  <!-- En-tête -->
  <header class="page-header">
    <h1 class="page-title">Catégories</h1>
    <button type="button" class="btn btn-primary" disabled title="Fonctionnalité à venir en phase B">
      <svg viewBox="0 0 448 512" class="icon">
        <path d="M256 80c0-17.7-14.3-32-32-32s-32 14.3-32 32V224H48c-17.7 0-32 14.3-32 32s14.3 32 32 32H192V432c0 17.7 14.3 32 32 32s32-14.3 32-32V288H400c17.7 0 32-14.3 32-32s-14.3-32-32-32H256V80z"/>
      </svg>
      Nouvelle catégorie
    </button>
  </header>

  <!-- Grille de catégories -->
  <div class="categories-grid">
    @for (category of categories(); track category.id) {
      <app-category-card
        [category]="category"
        [subcategories]="getSubcategoriesForCategory(category.id)"
        (editCategory)="onEditCategory($event)"
        (deleteCategory)="onDeleteCategory($event)"
        (addSubcategory)="onAddSubcategory($event)"
        (editSubcategory)="onEditSubcategory($event)"
        (deleteSubcategory)="onDeleteSubcategory($event)"
      />
    } @empty {
      <p class="empty-state">Aucune catégorie pour le moment.</p>
    }
  </div>
</div>
